apiVersion: v1
kind: Pod
metadata:
  name: liveness-demo
spec:
  containers:
  - name: web
    image: busybox:1.36
    command: ["sh", "-c"]
    args:
      - |
        httpd -f -p 8080 -h /www &
        sleep 20
        killall httpd
        sleep 3600
    livenessProbe:
      httpGet:
        path: /
        port: 8080
      initialDelaySeconds: 5
      periodSeconds: 5
      failureThreshold: 2
