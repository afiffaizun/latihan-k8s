apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-demo
  template:
    metadata:
      labels:
        app: config-demo
    spec:
      containers:
      - name: app
        image: busybox:1.36
        command: ["sh", "-c", "env | grep -E 'APP_|DB_' && sleep 3600"]
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secret
