apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-deploy-vol
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-vol-demo
  template:
    metadata:
      labels:
        app: config-vol-demo
    spec:
      containers:
      - name: app
        image: busybox:1.36
        command: ["sh", "-c", "sleep 3600"]
        volumeMounts:
        - name: secret-vol
          mountPath: "/etc/secret"
          readOnly: true
      volumes:
      - name: secret-vol
        secret:
          secretName: app-secret
