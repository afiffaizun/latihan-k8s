apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-ns-demo
  namespace: latihan-ns
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-ns-demo
  template:
    metadata:
      labels:
        app: nginx-ns-demo
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
